name: Auto-merge

# The owner's pull requests merge themselves once the Tests workflow has passed on their latest commit (#174, #175), which
# is the same as the check "Ready to merge" being green. Then the verification of main (the whole unit and E2E suites)
# runs, and gates the release and the deployment.
#
# Opt out with a draft pull request, or the label `no-auto-merge`.
#
# A merge made with the workflow token does not start the push-triggered workflows, so this starts the verification of
# main itself (workflow_dispatch is the one event that token can trigger). A merge you make by hand starts it by push.
#
# Why not GitHub's own auto-merge with a ruleset: a ruleset that requires a check on main would block the release
# job's own push of the version commit, and GitHub does not allow the Actions app to bypass a ruleset on a
# personal repository.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    name: Merge the pull request
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge it if it is the owner's, ready, and unchanged since the tests ran
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$PR" ]; then echo "No pull request for this run."; exit 0; fi
          info=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,isDraft,headRefOid,baseRefName,author,labels)
          field() { echo "$info" | jq -r "$1"; }
          skip() { echo "Not merging #$PR: $1"; exit 0; }
          [ "$(field .state)" = "OPEN" ] || skip "it is not open"
          [ "$(field .isDraft)" = "false" ] || skip "it is a draft"
          [ "$(field .baseRefName)" = "main" ] || skip "it does not target main"
          [ "$(field .author.login)" = "$GITHUB_REPOSITORY_OWNER" ] || skip "it is not the owner's"
          [ "$(field '[.labels[].name] | index("no-auto-merge") | not')" = "true" ] || skip "it has the label no-auto-merge"
          [ "$(field .headRefOid)" = "$TESTED_SHA" ] || skip "it changed after these tests ran; the newer commit has its own run"
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge
          echo "Merged #$PR. Starting the verification of main."
          gh workflow run main-verify.yml --repo "$GITHUB_REPOSITORY" --ref main
