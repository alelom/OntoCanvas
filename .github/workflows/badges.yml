name: Test badges

# The state of main, as the README badges show it (#174, #175): the unit tests and each E2E area, run nightly and on
# demand, each result written as a small JSON file to the `badges` branch that shields.io renders (its `endpoint`
# badge). Pull requests do not run this; test.yml covers them. The branch holds nothing else.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  areas:
    name: List the areas
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.list.outputs.areas }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: list
        run: echo "areas=$(node scripts/e2eSelect.mjs --all --json | node -p "JSON.stringify(JSON.parse(require('fs').readFileSync(0,'utf8')).areas)")" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Record the result
        if: always()
        run: |
          mkdir -p result
          echo '{"name":"unit","label":"unit tests","status":"${{ job.status }}"}' > result/unit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-unit
          path: result/

  e2e:
    name: "E2E: ${{ matrix.area }}"
    needs: [areas]
    # Pinned: ubuntu-latest is now 26.04, which this Playwright cannot install Chromium on.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.areas.outputs.areas) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:area -- ${{ matrix.area }}
        env:
          EDITOR_E2E_URL: http://localhost:5173/
      - name: Record the result
        if: always()
        run: |
          mkdir -p result
          echo '{"name":"e2e-${{ matrix.area }}","label":"E2E ${{ matrix.area }}","status":"${{ job.status }}"}' > result/e2e-${{ matrix.area }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-e2e-${{ matrix.area }}
          path: result/

  publish:
    name: Publish the badges
    needs: [areas, unit, e2e]
    if: always() && needs.areas.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Write the badge files
        run: node scripts/writeBadges.mjs results badges-out
      - name: Push them to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          rm -rf publish && mkdir publish
          cd publish
          git init -q -b badges
          cp ../badges-out/*.json .
          git add -A
          git commit -q -m "badges: ${{ github.run_id }}"
          git push --force "$url" badges
