name: Deploy to GitHub Pages

on:
  release:
    types: [created]
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Only the commit that was verified and released is deployed. The Release run's head is the verified commit; main's tip
  # must be that commit or the version commit semantic-release put right on top of it. If main has moved on, the newer
  # commit's own verification, release and deploy will ship it, and this run fails rather than deploying something else.
  gate:
    if: github.event_name == 'release' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Is main the released commit?
        if: github.event_name == 'workflow_run'
        env:
          RELEASED: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(git rev-parse HEAD)
          parent=$(git rev-parse HEAD^ 2>/dev/null || true)
          subject=$(git log -1 --format=%s)
          if [ "$tip" = "$RELEASED" ] || { [ "$parent" = "$RELEASED" ] && [[ "$subject" == chore\(release\)* ]]; }; then
            echo "main is at $tip, the released commit $RELEASED (or its version commit)."
          else
            echo "::error::main is at $tip, not the released commit $RELEASED; the newer commit will be deployed by its own run."
            exit 1
          fi

  deploy:
    needs: gate
    if: github.event_name == 'release' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /OntoCanvas/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Pushes the same build to the gh-pages branch of a second Pages repo (a deploy target only).
  # Skipped with a notice until the MIRROR_DEPLOY_KEY secret exists, so it never blocks the job above.
  mirror:
    needs: gate
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: "pages-mirror"
      cancel-in-progress: false
    env:
      MIRROR_REPO: BuroHappoldMachineLearning/OntoCanvas
      MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
    steps:
      - name: Check deploy key
        id: key
        run: |
          if [ -z "$MIRROR_DEPLOY_KEY" ]; then
            echo "::notice::MIRROR_DEPLOY_KEY is not set; skipping the mirror deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: npm ci

      - name: Build
        if: steps.key.outputs.present == 'true'
        run: npm run build
        env:
          VITE_BASE_PATH: /OntoCanvas/
          # The version link in the bottom bar names the repository this copy is served from.
          VITE_REPO_URL: https://github.com/${{ env.MIRROR_REPO }}

      - name: Push dist to the mirror repo
        if: steps.key.outputs.present == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/mirror_key -o IdentitiesOnly=yes"
          SRC_SHA=$(git rev-parse --short HEAD)
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: alelom/OntoCanvas@${SRC_SHA}"
          git push --force "git@github.com:${MIRROR_REPO}.git" gh-pages
