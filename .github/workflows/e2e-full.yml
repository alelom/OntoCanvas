name: E2E full (run by hand before a merge)

# The ready-to-merge check (#174, #175). Pull requests run only the E2E areas their changes touch (test.yml); this runs
# the WHOLE E2E suite on a pull request's head commit and records the result as the commit status `e2e-full`.
#
#   gh workflow run e2e-full.yml -f pr=<number>
#
# A commit status belongs to one commit, so a new commit on the pull request drops it and this has to be run again.
# The ruleset on main requires `e2e-full` for a merge through a pull request; the repository admin can still push
# to main directly.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: e2e-full-${{ inputs.pr }}
  cancel-in-progress: false # a cancelled run would leave `pending` on the commit; a newer run overwrites the status

jobs:
  head:
    name: Resolve the pull request
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      areas: ${{ steps.areas.outputs.areas }}
    steps:
      - name: Find the head commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh pr view "${{ inputs.pr }}" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ -z "$sha" ]; then echo "No pull request ${{ inputs.pr }}"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: List every area
        id: areas
        run: echo "areas=$(node scripts/e2eSelect.mjs --all --json | node -p "JSON.stringify(JSON.parse(require('fs').readFileSync(0,'utf8')).areas)")" >> "$GITHUB_OUTPUT"

      - name: Mark the commit as pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=pending -f context=e2e-full \
            -f description="The full E2E suite is running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  e2e:
    name: "E2E: ${{ matrix.area }}"
    needs: [head]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.head.outputs.areas) }}
    steps:
      - name: Checkout the head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.head.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the E2E tests of this area
        run: npm run test:e2e:area -- ${{ matrix.area }}
        env:
          EDITOR_E2E_URL: http://localhost:5173/

  status:
    name: Record e2e-full on the commit
    needs: [head, e2e]
    if: always() && needs.head.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Set the commit status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$RESULT" = "success" ]; then state=success; text="The full E2E suite passed"; else state=failure; text="The full E2E suite did not pass ($RESULT)"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ needs.head.outputs.sha }}" \
            -f state="$state" -f context=e2e-full \
            -f description="$text" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
