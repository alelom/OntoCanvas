name: Tests

# A pull request runs the type-check, the unit tests that import or read what changed, and the E2E areas the changed files
# touch (#174, #175). When they pass the check "Ready to merge" is green, which the ruleset on main requires for a
# merge. The WHOLE unit and E2E suites run after the merge, on main (main-verify.yml), and gate the release and the
# deployment. workflow_dispatch runs everything, against any ref.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-progress run for the same PR when a new commit is pushed to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Public-repo hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails the PR if an internal-only name leaks into this public repo. Organisation-specific
      # literals come from the INTERNAL_NAME_PATTERNS secret; generic patterns are committed.
      - name: Check for internal names
        run: node scripts/ci/check-internal-names.mjs
        env:
          INTERNAL_NAME_PATTERNS: ${{ secrets.INTERNAL_NAME_PATTERNS }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run build` (Vite) does not type-check, so without this a type error reaches main (#126).
      - name: Type-check
        run: npm run typecheck

      # The tests that import a changed file (Vitest's import graph), plus the few that read files from disk
      # (tests/unitSelect.json). The whole suite runs after the merge.
      - name: Run the unit tests this change touches
        if: github.event_name == 'pull_request'
        run: npm run test:affected -- --base "${{ github.event.pull_request.base.sha }}" --no-worktree

      - name: Run all unit tests
        if: github.event_name != 'pull_request'
        run: npm test

  # Pull requests run only the E2E areas the changed files touch (tests/e2e/areas.json, scripts/e2eSelect.mjs); a file
  # the map does not place selects every area. The whole suite runs after the merge (main-verify.yml).
  e2e-select:
    name: Select E2E areas
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.pick.outputs.areas }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pick the areas
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/e2eSelect.mjs --changed --base "${{ github.event.pull_request.base.sha }}" --no-worktree --json > selection.json
          else
            node scripts/e2eSelect.mjs --all --json > selection.json
          fi
          cat selection.json
          echo "areas=$(node -p "JSON.stringify(JSON.parse(require('fs').readFileSync('selection.json','utf8')).areas)")" >> "$GITHUB_OUTPUT"

      # Which areas run, which are skipped, and which file selected each (shown on the run's summary page).
      # Only information: a failure here must not skip every area and block the merge.
      - name: Explain the selection
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/e2eSelect.mjs --changed --base "${{ github.event.pull_request.base.sha }}" --no-worktree --summary >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/e2eSelect.mjs --all --summary >> "$GITHUB_STEP_SUMMARY"
          fi

  # One job per area (a matrix cannot do this: a job's `if` cannot read the matrix), so every area shows on the pull request,
  # run or skipped. A unit test keeps this list in step with tests/e2e/areas.json (#189).
  e2e-loading:
    name: "E2E: loading"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'loading')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: loading

  e2e-saving:
    name: "E2E: saving"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'saving')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: saving

  e2e-layout:
    name: "E2E: layout"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'layout')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: layout

  e2e-display-config:
    name: "E2E: display-config"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'display-config')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: display-config

  e2e-data-properties:
    name: "E2E: data-properties"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'data-properties')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: data-properties

  e2e-relationships:
    name: "E2E: relationships"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'relationships')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: relationships

  e2e-nodes:
    name: "E2E: nodes"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'nodes')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: nodes

  e2e-annotations:
    name: "E2E: annotations"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'annotations')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: annotations

  e2e-external-refs:
    name: "E2E: external-refs"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'external-refs')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: external-refs

  e2e-imports:
    name: "E2E: imports"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'imports')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: imports

  e2e-search:
    name: "E2E: search"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'search')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: search

  e2e-embed:
    name: "E2E: embed"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'embed')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: embed

  e2e-shell:
    name: "E2E: shell"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'shell')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: shell

  e2e-sparql:
    name: "E2E: sparql"
    needs: [e2e-select]
    if: contains(fromJSON(needs.e2e-select.outputs.areas), 'sparql')
    uses: ./.github/workflows/e2e-area.yml
    with:
      area: sparql

  # The one check the ruleset on main requires. The E2E areas that run differ on every pull request, so none of them can
  # be required by name; this job is green when every job that ran passed (a skipped one, an area nothing touched, counts
  # as passed), and red if any failed or was cancelled. It reads every job's result, so a new job cannot be left out.
  ready-to-merge:
    name: Ready to merge
    needs: [hygiene, unit-tests, e2e-select, e2e-loading, e2e-saving, e2e-layout, e2e-display-config, e2e-data-properties, e2e-relationships, e2e-nodes, e2e-annotations, e2e-external-refs, e2e-imports, e2e-search, e2e-embed, e2e-shell, e2e-sparql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Every job that ran passed
        run: node scripts/ci/ready-to-merge.mjs
        env:
          NEEDS: ${{ toJSON(needs) }}
