name: Tests

# Tests (unit + the E2E areas the change touches) run only on pull requests. Direct pushes to main assume the
# PR already passed and skip straight to Release (see release.yml). workflow_dispatch
# is kept so the full suite can still be run manually against any ref.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-progress run for the same PR when a new commit is pushed to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Public-repo hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails the PR if an internal-only name leaks into this public repo. Organisation-specific
      # literals come from the INTERNAL_NAME_PATTERNS secret; generic patterns are committed.
      - name: Check for internal names
        run: node scripts/ci/check-internal-names.mjs
        env:
          INTERNAL_NAME_PATTERNS: ${{ secrets.INTERNAL_NAME_PATTERNS }}

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.filter.outputs.unit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            unit:
              - 'src/**'
              - 'tests/unit/**'
              - 'vitest.config.ts'
              - 'tests/unitSetup.ts'
              - 'tests/unitGlobalSetup.ts'
              - 'tests/storageShim.ts'
              - 'tests/fixtures/**'
              - 'tests/e2e/**'
              - 'scripts/**'
              - 'examples/**'
              - 'package.json'
              - 'package-lock.json'

  unit-tests:
    name: Unit Tests
    needs: [changes]
    if: needs.changes.outputs.unit == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run build` (Vite) does not type-check, so without this a type error reaches main (#126).
      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm test -- --coverage

      - name: Get commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Upload unit test coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ steps.sha.outputs.sha }}
          path: coverage/
          retention-days: 90

  # Pull requests run only the E2E areas the changed files touch (tests/e2e/areas.json, scripts/e2eSelect.mjs); a file
  # the map does not place selects every area. The whole suite is run by hand before a merge: e2e-full.yml (#174, #175).
  e2e-select:
    name: Select E2E areas
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.pick.outputs.areas }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pick the areas
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/e2eSelect.mjs --changed --base "${{ github.event.pull_request.base.sha }}" --no-worktree --json > selection.json
          else
            node scripts/e2eSelect.mjs --all --json > selection.json
          fi
          cat selection.json
          echo "areas=$(node -p "JSON.stringify(JSON.parse(require('fs').readFileSync('selection.json','utf8')).areas)")" >> "$GITHUB_OUTPUT"
          echo "any=$(node -p "JSON.parse(require('fs').readFileSync('selection.json','utf8')).areas.length > 0")" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: "E2E: ${{ matrix.area }}"
    needs: [e2e-select]
    if: needs.e2e-select.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.e2e-select.outputs.areas) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # No --coverage: Vitest's v8 coverage instruments only the Node process running the test files, while
      # the app under test runs in Chromium, so it measured a few imported modules, not the app (#96).
      - name: Run the E2E tests of this area
        run: npm run test:e2e:area -- ${{ matrix.area }}
        env:
          EDITOR_E2E_URL: http://localhost:5173/
